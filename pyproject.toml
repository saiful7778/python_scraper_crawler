[project]
name = "python-scraper-crawler"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi-startkit[fastapi,inertia,redis,vite]==0.74.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.3",
    "python-worker>=2.2.4",
    "ruff>=0.17.4",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "tortoise-orm[asyncpg,ipython]>=1.1.9",
]

[project.scripts]
google-map-scrape = "cli.google_map_scrape_cli:main"
crawler = "cli.crawler_cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "pyright>=1.1.414",
    "fakeredis[lua]>=2.40.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["postgres: needs a reachable Postgres server; skipped otherwise"]

[tool.ruff]
include = [
    "app/**/*.py",
    "bootstrap/**/*.py",
    "cli/**/*.py",
    "commands/**/*.py",
    "config/**/*.py",
    "databases/**/*.py",
    "providers/**/*.py",
    "routes/**/*.py",
    "tasks/**/*.py",
    "tests/**/test_*.py"
]
exclude = [
    "app/migrations/**/*.py"
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = true
venvPath = "."
venv = ".venv"
include = [
    "app",
    "bootstrap",
    "cli",
    "commands",
    "config",
    "providers",
    "routes",
    "tasks",
    "tests"
]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "**/node_modules",
    "app/migrations"
]

[tool.tortoise]
tortoise_orm = "config.tortoise.TORTOISE_ORM"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "bootstrap*", "cli*", "commands*", "config*", "providers*", "routes*", "tasks*"]
