[project]
name = "python-scraper-crawler"
version = "0.1.0"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi-startkit[fastapi,inertia,vite]==0.74.0",
    "ruff>=0.17.4",
    "tortoise-orm[asyncpg,ipython]>=1.1.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
include = [
    "app/**/*.py",
    "bootstrap/**/*.py",
    "commands/**/*.py",
    "config/**/*.py",
    "databases/**/*.py",
    "providers/**/*.py",
    "routes/**/*.py",
    "tasks/**/*.py",
    "tests/**/test_*.py"
]

[tool.tortoise]
tortoise_orm = "config.tortoise.TORTOISE_ORM"
