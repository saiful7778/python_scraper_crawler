# Durability: resume needs the buffer on disk, not just in memory
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
dir /data

# Keep RDB snapshots as a periodic backup
save 900 1
save 300 10
save 60 10000

# Never evict buffered rows or known keys; fail the write instead
maxmemory 200mb
maxmemory-policy noeviction
